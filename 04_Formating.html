<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="description" content="HTML Website for info 302 subject">
  <title>HTML Website | Formating</title>
</head>

<body>
  <!-- 
  - b ⇒ bold
  - i ⇒ italic
  - u ⇒ Underline
  - del ⇒ Used in prices
  - sup 
  - sub 
  - span
  - br => break line
  - hr => horizontal line
  - HTML Entities
 -->
  <h1>Formating</h1>
  <h2>Market Wave Company</h2>
  <!-- Bold -->
  <p>We have made this website <b>Market wave</b> for 3 weeks</p>
  <!-- Italic -->
  <p>We have made this website <i>Market wave</i> for 3 weeks</p>
  <!-- Underline -->
  <p>We have made this website <u>Market wave</u> for 3 weeks</p>
  <!-- del -->
  <p><del>20$</del> 18$</p>
  <!-- sup -->
  <p>5<sup>2</sup></p>
  <!-- sub -->
  <p>H<sub>2</sub>O</p>
  <!-- span -->
  <p>We have made this website <span style="color: red;">Market wave</span> for 3 weeks</p>
  <!-- br -->
  <p>Hello <br>
    World <br>
    from <br>
    HTML <br>
  </p>
  <!-- hr -->
  <hr>
  <!-- HTML Entities -->
  <p>&copy; Copyright</p>
</body>

</html>
